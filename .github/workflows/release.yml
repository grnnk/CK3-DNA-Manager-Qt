name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DBUILD_SCREENSHOTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/release --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          .\tools\deploy.ps1 -Config Release -SkipBuild -SkipTests `
            -BuildDir build/release/Release `
            -QtPath $env:QT_ROOT_DIR `
            -Version $version `
            -Zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: CK3-DNA-Manager-*-win64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          install-deps: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 patchelf desktop-file-utils \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libgl1-mesa-dev

      - name: Install linuxdeploy
        run: |
          mkdir -p "$HOME/.local/bin"
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O "$HOME/.local/bin/linuxdeploy"
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O "$HOME/.local/bin/linuxdeploy-plugin-qt"
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/linuxdeploy-plugin-qt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./tools/deploy.sh \
            --config Release \
            --appimage \
            --tar \
            --version "$VERSION" \
            --qt-path "$QT_ROOT_DIR"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            CK3-DNA-Manager-*-linux-*.AppImage
            CK3-DNA-Manager-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -F -v -x "$TAG" | head -n 1 || true)"

          {
            echo "## What's changed"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$TAG"
              echo
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "$TAG"
            fi
            echo
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (64-bit) | \`CK3-DNA-Manager-${VERSION}-win64.zip\` |"
            echo "| Linux (x86_64) | \`CK3-DNA-Manager-${VERSION}-linux-x86_64.AppImage\` |"
            echo "| Linux (x86_64) | \`CK3-DNA-Manager-${VERSION}-linux-x86_64.tar.gz\` |"
            echo
            echo "SHA-256 checksums are attached as \`SHA256SUMS.txt\`."
            echo
            echo "## Web version"
            echo
            echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CK3 DNA Manager ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
